# Weekly pull requests that update dependencies, so security fixes (like the
# ip-address and follow-redirects ones) arrive without anyone having to run
# `npm audit`. Minor and patch updates are grouped into one PR per app to keep
# the noise down; major version bumps come as their own PRs to review.
# CI (.github/workflows/ci.yml) runs the tests on every one of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    # Major jumps in the core server libraries can change behaviour the tests
    # don't cover, so they are upgraded on purpose, not by a bot. Security
    # updates still arrive as PRs regardless of this list.
    ignore:
      - dependency-name: mongoose
        update-types: ["version-update:semver-major"]
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: dotenv
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
