name: Keep Warm

# Free hosting (Render) puts the API to sleep after about 15 minutes without
# a visitor, and the first request afterwards waits 30-50 seconds while it
# wakes up. This job visits the health address every 10 minutes during the day
# in Nepal (05:45-23:35, UTC 00:00-17:50) so students rarely hit that wait. It
# is off until you opt in: add a repository VARIABLE (Settings > Secrets and
# variables > Actions > Variables) named KEEP_WARM_URL with your API's health
# address, e.g. https://pcps-connect-backend.onrender.com/api/health
#
# It sleeps overnight on purpose, to save the free monthly instance hours.
# A failed visit is shown as a warning and never as a failed run, so a server
# outage does not send you an email every 10 minutes. To stop it, delete the
# variable (or this file).

on:
  schedule:
    - cron: "*/10 0-17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEP_WARM_URL != '' }}
    steps:
      - name: Visit the health address
        env:
          URL: ${{ vars.KEEP_WARM_URL }}
        run: |
          if curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 15 "$URL" > /dev/null; then
            echo "Server is awake."
          else
            echo "::warning::The server did not answer the health check."
          fi
