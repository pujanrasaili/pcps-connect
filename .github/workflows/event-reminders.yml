name: Event Reminders

# Runs scripts/sendEventReminders.js twice a day so students get a "your
# event is coming up" email even though there's no always-on process in this
# app to run a cron job itself. The script looks at the next 24 hours and never
# emails the same registration twice, so a second run is safe.
#
# Why twice: with one run a day, an event starting just after that run's time
# the next day would only be reminded a few minutes before it begins. Runs at
# 03:00 UTC (8:45 am in Nepal, UTC+5:45) and 09:00 UTC (2:45 pm) mean everyone
# is told at least about six hours ahead. Adjust the cron lines below if
# different local times are wanted.
#
# Needs these repo secrets set under Settings -> Secrets and variables ->
# Actions (same values as the backend's .env -- see backend/.env.example):
#   MONGO_URI, EMAIL_USER, EMAIL_APP_PASSWORD
# Without them this job will run and fail cleanly (the script errors out
# trying to connect), it just won't send anything.

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets this be triggered manually from the Actions tab too

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run reminders
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Optional: add these two secrets to send through Brevo instead of Gmail
          # (the same sender the live site uses). Left empty, Gmail is used.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
