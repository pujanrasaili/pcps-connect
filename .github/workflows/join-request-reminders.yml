name: Join Request Reminders

# Runs scripts/sendJoinRequestReminders.js twice a week (Monday and Thursday,
# 03:00 UTC = 08:45 in Nepal) so students who asked to join a club that
# approves its members are not left waiting: leaders (or admins, for a club
# with none) get one email listing clubs with requests older than 5 days.
# Nothing is sent when nobody is overdue.
#
# Uses the same repo secrets as the other jobs: MONGO_URI, EMAIL_USER,
# EMAIL_APP_PASSWORD, optionally CLIENT_ORIGIN, BREVO_API_KEY and
# BREVO_SENDER_EMAIL. To preview, run it from the Actions tab with "dry run" ticked.

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (list recipients, send nothing)"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run request-reminders -- ${{ inputs.dry && '--dry' || '' }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
